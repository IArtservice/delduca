<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>DelDuca Weddings | Preventivo Matrimonio Premium</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#f5efe9; font-family:'Inter',sans-serif; color:#2c241f; min-height:100vh; }
    .intro-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:#fefaf5; z-index:10000; display:flex; align-items:center; justify-content:center; transition:opacity 0.8s cubic-bezier(0.2,0.9,0.4,1); pointer-events:none; }
    .intro-overlay.fade-out { opacity:0; visibility:hidden; }
    .intro-logo { width:300px; height:auto; filter:drop-shadow(0 20px 30px rgba(0,0,0,0.08)); animation:introRise 0.7s ease-out; }
    @keyframes introRise { 0%{opacity:0;transform:translateY(20px) scale(0.96);} 100%{opacity:1;transform:translateY(0) scale(1);} }
    .logo-fixed { position:fixed; top:28px; left:28px; width:100px; z-index:1000; filter:drop-shadow(0 4px 12px rgba(0,0,0,0.1)); opacity:0; transform:scale(0.92); transition:opacity 0.5s ease 0.3s,transform 0.4s ease 0.3s; pointer-events:none; cursor:pointer; }
    .logo-fixed.visible { opacity:1; transform:scale(1); pointer-events:auto; }
    .container { max-width:1400px; margin:0 auto; padding:2rem 1.8rem; opacity:0; transform:translateY(18px); transition:opacity 0.6s ease 0.4s,transform 0.6s ease 0.4s; }
    .container.visible { opacity:1; transform:translateY(0); }
    .wedding-card { background:#ffffff; border-radius:2rem; box-shadow:0 30px 50px -20px rgba(0,0,0,0.2),0 0 0 1px rgba(224,196,158,0.2); overflow:hidden; }
    .hero { background:linear-gradient(135deg,#fffaf5,#fff5ec); padding:2.5rem 2rem; text-align:center; border-bottom:1px solid #f0e0cf; }
    .hero h1 { font-family:'Cormorant Garamond',serif; font-size:3rem; font-weight:700; color:#b45a2e; letter-spacing:-0.2px; }
    .hero p { font-size:1rem; color:#8e6a4d; margin-top:0.5rem; font-weight:500; }
    .progress-area { padding:1.8rem 2rem 0.5rem; }
    .progress-track { background:#efe3d8; border-radius:40px; height:6px; }
    .progress-fill { background:#c47a44; width:0%; height:100%; border-radius:40px; transition:width 0.4s ease; }
    .step-counter { display:flex; justify-content:space-between; margin-top:0.8rem; font-weight:500; color:#a77b58; font-size:0.85rem; }
    .step-content { padding:2rem 2rem 1rem; min-height:520px; }
    .category-title { font-family:'Cormorant Garamond',serif; font-size:2rem; font-weight:700; color:#3a2a1f; display:flex; align-items:baseline; flex-wrap:wrap; gap:1rem; margin-bottom:0.3rem; }
    .badge-cat { background:#f4e8df; font-size:0.7rem; font-weight:600; padding:0.2rem 1rem; border-radius:60px; color:#b45a2e; letter-spacing:0.3px; }
    .sub { color:#b38b6b; margin-bottom:2rem; border-left:3px solid #e9cfb9; padding-left:1rem; font-size:0.9rem; }
    .options-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:1.5rem; margin:2rem 0 1.5rem; }
    .option-card { background:#fffdfb; border-radius:1.25rem; padding:1.3rem; border:1px solid #ede0d2; transition:all 0.3s cubic-bezier(0.2,0.9,0.4,1.1); cursor:pointer; box-shadow:0 6px 12px -8px rgba(0,0,0,0.05); animation:cardReveal 0.45s backwards; animation-delay:calc(0.03s * var(--order,0)); }
    @keyframes cardReveal { from{opacity:0;transform:translateY(14px) scale(0.97);} to{opacity:1;transform:translateY(0) scale(1);} }
    .option-card:hover { transform:translateY(-5px); border-color:#cfaa83; box-shadow:0 18px 28px -12px rgba(0,0,0,0.12); }
    .option-card.selected { border:2px solid #c47a44; background:#fffaf4; box-shadow:0 12px 20px -12px rgba(196,122,68,0.25); }
    .option-name { font-weight:700; font-size:1.15rem; display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; gap:0.6rem; margin-bottom:0.5rem; color:#4b3321; }
    .option-price { background:#f5ece3; padding:0.2rem 0.8rem; border-radius:40px; font-size:0.8rem; font-weight:700; color:#bc6a36; white-space:nowrap; }
    .participants-area { margin-top:1rem; background:#fef7f0; border-radius:60px; padding:0.5rem 1rem; display:flex; align-items:center; gap:0.8rem; flex-wrap:wrap; font-size:0.8rem; font-weight:500; }
    .participants-area input { width:85px; padding:0.35rem 0.6rem; border-radius:60px; border:1px solid #e2cfbc; text-align:center; font-weight:600; }
    .opt-desc { font-size:0.7rem; color:#b4845c; margin-top:0.7rem; line-height:1.3; }
    .nav-buttons { display:flex; justify-content:space-between; padding:0.5rem 2rem 2rem; gap:1rem; flex-wrap:wrap; }
    button { background:#ede0d4; border:none; padding:0.8rem 2rem; font-weight:600; font-size:0.9rem; border-radius:60px; cursor:pointer; transition:0.2s; font-family:'Inter',sans-serif; color:#5a3e2c; }
    button.primary { background:#c47a44; color:white; box-shadow:0 2px 8px rgba(0,0,0,0.05); }
    button.primary:hover { background:#ad6534; transform:translateY(-2px); }
    button.secondary:hover { background:#dfcdbd; }
    button:disabled { opacity:0.5; cursor:default; }
    .summary-table { background:#fffbf7; border-radius:1.5rem; padding:1.5rem; margin:1.5rem 0; border:1px solid #eedfcb; }
    .summary-row { display:flex; justify-content:space-between; padding:0.8rem 0; border-bottom:1px solid #f0e0ce; font-size:0.9rem; }
    .total-row { font-weight:800; font-size:1.3rem; color:#bc6a36; border-top:2px dashed #e7cfb7; margin-top:1rem; padding-top:1rem; display:flex; justify-content:space-between; }
    .input-name { width:100%; padding:1rem 1.2rem; border-radius:60px; border:1px solid #e7d5c3; font-size:1rem; margin:0.5rem 0; background:white; font-family:'Inter',sans-serif; }
    .send-group { display:flex; gap:1rem; flex-wrap:wrap; margin-top:1rem; }
    .send-btn { flex:1; background:#25D366; color:white; gap:8px; display:inline-flex; align-items:center; justify-content:center; }
    .send-btn.email { background:#6c5ce7; }
    .error-msg { color:#cf6f5a; font-size:0.75rem; margin-top:0.3rem; }
    .status-msg { font-size:0.9rem; margin-top:0.5rem; font-weight:500; }
    .contact-details-form { background:#fef9f2; border-radius:1.5rem; padding:2rem; text-align:center; max-width:500px; margin:0 auto; border:1px solid #f0e2d2; }
    .contact-details-form h3 { font-family:'Cormorant Garamond',serif; margin-bottom:1rem; }
    footer { text-align:center; padding:1.2rem; font-size:0.7rem; color:#bc9a7a; border-top:1px solid #f3e5d8; }
    /* Tema grafico ispirato al documento DelDuca: bianco, grigio e blu. */
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #26282c;
      --muted-ink: #5d626b;
      --blue: #6f94d5;
      --blue-dark: #456eae;
      --blue-pale: #edf3fc;
      --line: #d6e1f2;
    }
    body { background:#f3f4f6; color:var(--ink); }
    .intro-overlay { background:var(--paper); }
    .container { max-width:1200px; }
    .wedding-card {
      position:relative;
      isolation:isolate;
      background:var(--paper);
      border:1px solid var(--line);
      border-radius:0.8rem;
      box-shadow:0 16px 40px rgba(34,52,83,0.09);
    }
    .wedding-card::before {
      content:"";
      position:absolute;
      inset:7rem 2rem auto auto;
      width:min(34vw,360px);
      height:300px;
      background:url('delduca-logo.png') no-repeat center / contain;
      opacity:0.035;
      pointer-events:none;
      z-index:-1;
    }
    .hero { background:#fff; border-bottom:2px solid var(--blue); }
    .hero h1, .category-title, .contact-details-form h3 {
      font-family:'Inter',sans-serif;
      color:var(--ink);
    }
    .hero h1 { letter-spacing:0; }
    .hero p { color:var(--muted-ink); }
    .progress-area { padding-top:1.5rem; }
    .progress-track { background:#e8edf5; }
    .progress-fill { background:var(--blue); }
    .step-counter { color:var(--blue-dark); }
    .category-title { color:var(--ink); }
    .badge-cat { background:var(--blue-pale); color:var(--blue-dark); }
    .sub { color:var(--muted-ink); border-left-color:var(--blue); }
    .option-card { background:#fff; border-color:var(--line); }
    .option-card:hover { border-color:var(--blue); box-shadow:0 14px 26px rgba(40,69,116,0.12); }
    .option-card.selected { border-color:var(--blue); background:#f5f8fe; box-shadow:0 8px 20px rgba(70,110,174,0.12); }
    .option-choice { display:flex; align-items:flex-start; gap:0.75rem; cursor:pointer; }
    .choice-input { width:1rem; height:1rem; flex:none; margin-top:0.2rem; accent-color:var(--blue-dark); }
    .option-choice .option-name { flex:1; }
    .option-name { color:var(--ink); }
    .option-price { background:var(--blue-pale); color:var(--blue-dark); }
    .participants-area { background:#f6f8fb; }
    .participants-area input, .input-name { border-color:#c9d5e8; }
    .opt-desc { color:var(--muted-ink); }
    button { background:#e8edf5; color:#35445c; }
    button.primary { background:var(--blue); color:#fff; }
    button.primary:hover { background:var(--blue-dark); }
    button.secondary:hover { background:#dce5f2; }
    .summary-table { background:#fff; border-color:var(--blue); border-radius:0.7rem; }
    .summary-row { border-bottom-color:#e6ebf2; }
    .total-row { color:var(--blue-dark); border-top-color:var(--blue); }
    .send-btn { background:var(--blue); color:#fff; }
    .send-btn.email { background:var(--blue-dark); }
    .error-msg { color:#a23e3e; }
    .contact-details-form { background:#fbfcfe; border-color:var(--line); border-radius:0.8rem; }
    footer { color:var(--muted-ink); border-top-color:var(--line); }
    .video-btn {
      display:inline-flex;
      align-items:center;
      gap:0.45rem;
      margin-top:0.75rem;
      padding:0.5rem 0.85rem;
      border:1px solid var(--blue);
      border-radius:0.4rem;
      background:#fff;
      color:var(--blue-dark);
      font-size:0.8rem;
    }
    .video-btn:hover { background:var(--blue-pale); }
    .video-modal {
      display:none;
      position:fixed;
      inset:0;
      z-index:11000;
      align-items:center;
      justify-content:center;
      padding:1rem;
    }
    .video-modal.visible { display:flex; }
    .video-modal-backdrop { position:absolute; inset:0; background:rgba(20,28,42,0.72); }
    .video-modal-dialog {
      position:relative;
      width:min(900px,100%);
      max-height:calc(100vh - 2rem);
      overflow:auto;
      padding:1rem;
      border:1px solid var(--blue);
      border-radius:0.7rem;
      background:#fff;
      box-shadow:0 24px 70px rgba(0,0,0,0.28);
    }
    .video-modal-header { display:flex; align-items:center; justify-content:space-between; gap:1rem; margin-bottom:0.8rem; }
    .video-modal-header h2 { color:var(--ink); font-size:1.15rem; }
    .video-close-button { padding:0.35rem 0.75rem; border-radius:0.35rem; font-size:1.25rem; }
    .video-player { display:block; width:100%; max-height:calc(100vh - 7rem); background:#111; }
    @media (max-width:700px) {
      .container { padding:1rem; }
      .hero h1 { font-size:2rem; }
      .category-title { font-size:1.6rem; }
      .options-grid { grid-template-columns:1fr; }
      .logo-fixed { width:70px; top:16px; left:16px; }
      .intro-logo { width:200px; }
      .wedding-card::before { inset:8rem 1rem auto auto; width:55vw; height:220px; }
      .video-modal-dialog { padding:0.75rem; }
    }
  </style>
</head>
<body>

<div id="introOverlay" class="intro-overlay">
  <img id="introLogoImg" class="intro-logo" src="delduca-logo.png" alt="DelDuca Weddings" onerror="this.src='https://placehold.co/400x200?text=DelDuca&bg=F2E3D6&color=BB6B3A'">
</div>

<img id="fixedLogo" class="logo-fixed" src="delduca-logo.png" alt="DelDuca Weddings" onerror="this.src='https://placehold.co/200x100?text=DelDuca&bg=F2E3D6&color=BB6B3A'">

<div id="mainContainer" class="container">
  <div class="wedding-card">
    <div class="hero">
      <h1>DelDuca Weddings</h1>
      <p>Simula e crea il tuo budget per il tuo evento</p>
    </div>
    <div class="progress-area">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="step-counter"><span id="stepLabel"></span><span id="totalPreview" style="font-weight:600;">€ 0</span></div>
    </div>
    <div id="dynamicStep" class="step-content"></div>
    <div class="nav-buttons" id="navButtons"></div>
    <footer>Ogni categoria può essere saltata con "Non mi interessa". Alla fine inserisci i tuoi dati per visualizzare il riepilogo.</footer>
  </div>
</div>

<div id="videoModal" class="video-modal" aria-hidden="true">
  <div class="video-modal-backdrop" data-close-video></div>
  <section class="video-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="videoModalTitle">
    <div class="video-modal-header">
      <h2 id="videoModalTitle"></h2>
      <button type="button" class="video-close-button" data-close-video aria-label="Chiudi il video">×</button>
    </div>
    <video id="productVideo" class="video-player" controls playsinline preload="none">
      Il tuo browser non supporta la riproduzione video.
    </video>
  </section>
</div>

<script>
  // URL web app (per invio contatti)
  const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbyxwGvW6HLcS0Hp20re6U-mvmZgRRr5X744olpeK2zWQQNVYm2kX4q9-TJAwHaJ4c5N/exec";

  // Categorie del configuratore
  const CATEGORIES = [
    { name: "Location & Ricevimento", options: [
        { name: "Fascia 1: Villa sul lago e villa storica", price: 5000, startingAt: true },
        { name: "Fascia 2: Castelli e ristoranti 5 stelle", price: 2500, startingAt: true },
        { name: "Fascia 3: Agriturismi e ristoranti fascia alta", price: 1000, startingAt: true }
      ] },
    { name: "Food", options: [
        { name: "Catering", price: 150, perPerson: true, startingAt: true },
        { name: "Cucina interna", price: 100, perPerson: true, startingAt: true },
        { name: "Cucina stellata", price: 200, perPerson: true, startingAt: true }
      ] },
    { name: "Fotografia & Video", options: [
        { name: "Foto", price: 800, startingAt: true },
        { name: "Foto + video", price: 2000, startingAt: true },
        { name: "Solo video maker", price: 1000 },
        { name: "Premium", price: 3000 }
      ] },
    { name: "Intrattenimento Musicale", options: [
        { name: "DJ, 1 postazione per 4 ore", price: 500 },
        { name: "DJ + intrattenitore", price: 900 },
        { name: "DJ con karaoke", price: 800 },
        { name: "DJ + conduttore", price: 1500 }
      ] },
    { name: "Fiori e Allestimenti", options: [
        { name: "Composizione base (bouquet + centrotavola)", price: 450 },
        { name: "Allestimento chiesa/simbolico", price: 780 },
        { name: "Allestimento completo (location + arco)", price: 1350 },
        { name: "Fiori secchi/bohemien", price: 620 }
      ] },
    { name: "Wedding Cake & Dessert", options: [
        { name: "Torta classica 1 piano", price: 180 },
        { name: "Torta 2 piani personalizzata", price: 290 },
        { name: "Cupcake tower (50 pz)", price: 220 },
        { name: "Millefoglie monumentale", price: 340 }
      ] },
    { name: "Trasporto Sposi & Ospiti", options: [
        { name: "Auto d'epoca", price: 700, startingAt: true },
        { name: "Limousine", price: 800, startingAt: true },
        { name: "Navetta per ospiti (fino a 20 posti)", price: 600 },
        { name: "Auto sportiva o cabrio", price: 400 }
      ] },
    { name: "Abiti", multiple: true, options: [
        { name: "Sartoria su misura sposo", price: 1000, startingAt: true },
        { name: "Sartoria su misura sposa", price: 1500, startingAt: true }
      ] },
    { name: "Social Communication", options: [
        { name: "Invito informativo base", price: 200 },
        { name: "Invito con sito, conferme e gestione intolleranze", price: 400 },
        { name: "Sito premium con countdown", price: 500 },
        { name: "Sito con permanenza online per un anno e contenuti a scelta", price: 600 }
      ] },
    { name: "Coordinamento", multiple: true, options: [
        { name: "Wedding planner", price: 1000, startingAt: true },
        { name: "Event planner", price: 700 },
        { name: "Music planner", price: 500 },
        { name: "Wedding consulting", price: 500 }
      ] },
    { name: "Special effect e intrattenimento passivo", multiple: true, options: [
        { name: "Photo booth", price: 700, video: "assets/videos/photoboot.mp4" },
        { name: "Foto con totem", price: 500 },
        { name: "Foto bus", price: 900, video: "assets/videos/photobus.mp4" },
        { name: "Pedana rotante", price: 600, video: "assets/videos/pedanarotante.mp4" },
        { name: "Smoke boom", price: 600, startingAt: true, video: "assets/videos/smokebomb.mp4" },
        { name: "Luci a batteria", price: 200, startingAt: true, video: "assets/videos/luci.mp4" },
        { name: "Fontane per torta", price: 400, startingAt: true, video: "assets/videos/fontanetorta.mp4" }
      ] }
  ];
  for (let cat of CATEGORIES) cat.options.push({ name: "Non mi interessa / Nessuno di questi", price: 0, perPerson: false });

  const TOTAL = CATEGORIES.length;
  const createEmptySelection = () => ({ optIndices: [], participants: null });
  let selections = Array(TOTAL).fill().map(createEmptySelection);
  let currentStep = 0;   // parte dalla prima categoria
  let userContact = { name: "", email: "", phone: "" };
  let showSummary = false; // controlla se mostrare il riepilogo dopo aver inserito i dati

  // DOM elements
  const dynamicDiv = document.getElementById('dynamicStep');
  const navDiv = document.getElementById('navButtons');
  const progressFill = document.getElementById('progressFill');
  const stepLabelSpan = document.getElementById('stepLabel');
  const totalPreviewSpan = document.getElementById('totalPreview');

  // Funzioni di calcolo e utilità
  function getSelectedOptions(stepIndex) {
    return selections[stepIndex].optIndices
      .map(optIndex => CATEGORIES[stepIndex].options[optIndex])
      .filter(Boolean);
  }
  function getOptionPrice(opt, selection) {
    if (opt.perPerson) return opt.price * (selection.participants || 0);
    return opt.price;
  }
  function formatOptionPrice(opt) {
    const amount = `€ ${opt.price.toLocaleString()}`;
    if (opt.perPerson) return `${opt.startingAt ? 'da ' : ''}${amount}/persona`;
    return `${opt.startingAt ? 'da ' : ''}${amount}`;
  }
  function renderOptionExtra(opt, participants) {
    if (opt.perPerson && opt.price !== 0) {
      const partVal = participants > 0 ? participants : 30;
      return `
        <div class="participants-area">
          <span>Numero invitati:</span>
          <input type="number" class="partInput" min="1" max="500" value="${partVal}">
          <span>persone</span>
        </div>
        <div class="opt-desc">Il costo del food viene calcolato in base al numero di invitati.</div>
      `;
    }
    if (opt.desc) return `<div class="opt-desc">${escapeHtml(opt.desc)}</div>`;
    return '';
  }
  function computeTotal() {
    let total = 0;
    for (let i = 0; i < TOTAL; i++) {
      const sel = selections[i];
      getSelectedOptions(i).forEach(opt => { total += getOptionPrice(opt, sel); });
    }
    return total;
  }
  function updateTotalPreview() {
    totalPreviewSpan.innerText = `€ ${computeTotal().toLocaleString()}`;
  }
  function updateProgress() {
    if (currentStep >= 0 && currentStep < TOTAL) {
      const percent = (currentStep / TOTAL) * 100;
      progressFill.style.width = `${percent}%`;
      stepLabelSpan.innerText = `${CATEGORIES[currentStep].name} · ${currentStep+1}/${TOTAL}`;
    } else if (currentStep === TOTAL && !showSummary) {
      progressFill.style.width = '100%';
      stepLabelSpan.innerText = `Inserisci i tuoi dati`;
    } else if (currentStep === TOTAL && showSummary) {
      progressFill.style.width = '100%';
      stepLabelSpan.innerText = `Riepilogo finale · ${TOTAL} categorie`;
    }
    updateTotalPreview();
  }
  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  // Render categorie
  function renderCategoryStep(stepIdx) {
    const cat = CATEGORIES[stepIdx];
    const selData = selections[stepIdx];
    const selectedIndices = selData.optIndices;
    let optsHtml = '';
    cat.options.forEach((opt, idx) => {
      const isSelected = selectedIndices.includes(idx);
      const selectedClass = isSelected ? 'selected' : '';
      const extra = isSelected ? renderOptionExtra(opt, selData.participants) : '';
      optsHtml += `
        <div class="option-card ${selectedClass}" data-opt-index="${idx}">
          <label class="option-choice">
            <input class="choice-input" type="${cat.multiple ? 'checkbox' : 'radio'}" name="category-${stepIdx}" value="${idx}" ${isSelected ? 'checked' : ''}>
            <span class="option-name">
            <span>${escapeHtml(opt.name)}</span>
            <span class="option-price">${formatOptionPrice(opt)}</span>
            </span>
          </label>
          ${opt.video ? `<button type="button" class="video-btn" data-video-src="${escapeHtml(opt.video)}" data-video-title="${escapeHtml(opt.name)}">▶ Guarda il video</button>` : ''}
          <div id="extra-${idx}">${extra}</div>
        </div>
      `;
    });
    return `
      <div class="category-title">
        ${escapeHtml(cat.name)}
        <span class="badge-cat">step ${stepIdx+1} di ${TOTAL}</span>
      </div>
      <div class="sub">${cat.multiple ? 'Puoi scegliere più proposte; usa "Non mi interessa" per saltare la categoria.' : 'Scegli una delle proposte, oppure "Non mi interessa" per saltare questa categoria.'}</div>
      <div class="options-grid" id="optionsGrid">
        ${optsHtml}
      </div>
      <div class="error-msg" id="stepError" style="display:none;">Seleziona un'opzione prima di proseguire.</div>
    `;
  }
  function attachCategoryEvents() {
    const grid = document.getElementById('optionsGrid');
    if (!grid) return;
    const cards = grid.querySelectorAll('.option-card');
    cards.forEach((card, i) => { card.style.setProperty('--order', i); });

    const updateCards = () => {
      cards.forEach(card => {
        const optIndex = parseInt(card.dataset.optIndex, 10);
        const opt = CATEGORIES[currentStep].options[optIndex];
        const isSelected = selections[currentStep].optIndices.includes(optIndex);
        card.classList.toggle('selected', isSelected);
        const choiceInput = card.querySelector('.choice-input');
        if (choiceInput) choiceInput.checked = isSelected;
        const extraDiv = card.querySelector(`#extra-${optIndex}`);
        if (extraDiv) extraDiv.innerHTML = isSelected ? renderOptionExtra(opt, selections[currentStep].participants) : '';

        const partInput = card.querySelector('.partInput');
        if (partInput) {
          partInput.addEventListener('change', (e) => {
            let val = parseInt(e.target.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 500) val = 500;
            e.target.value = val;
            selections[currentStep].participants = val;
            updateTotalPreview();
          });
          partInput.addEventListener('input', (e) => {
            const val = parseInt(e.target.value, 10);
            selections[currentStep].participants = (isNaN(val) || val < 1) ? 0 : Math.min(val, 500);
            updateTotalPreview();
          });
        }
      });
    };

    const chooseOption = (optIndex) => {
      const cat = CATEGORIES[currentStep];
      const selection = selections[currentStep];
      const noneIndex = cat.options.findIndex(opt => opt.price === 0);
      const opt = cat.options[optIndex];

      if (cat.multiple) {
        if (optIndex === noneIndex) {
          selection.optIndices = [optIndex];
          selection.participants = null;
        } else {
          selection.optIndices = selection.optIndices.filter(index => index !== noneIndex);
          if (selection.optIndices.includes(optIndex)) {
            selection.optIndices = selection.optIndices.filter(index => index !== optIndex);
          } else {
            selection.optIndices.push(optIndex);
          }
          selection.participants = null;
        }
      } else {
        selection.optIndices = [optIndex];
        if (opt.perPerson && opt.price !== 0) {
          if (!selection.participants || selection.participants < 1) selection.participants = 30;
        } else {
          selection.participants = null;
        }
      }

      updateCards();
      updateTotalPreview();
      const errDiv = document.getElementById('stepError');
      if (errDiv) errDiv.style.display = 'none';
    };

    cards.forEach(card => {
      const optIndex = parseInt(card.dataset.optIndex);
      card.addEventListener('click', (e) => {
        if (e.target.closest('input, .option-choice, .video-btn')) return;
        chooseOption(optIndex);
      });
      card.querySelector('.choice-input')?.addEventListener('change', () => {
        chooseOption(optIndex);
      });
    });
    grid.querySelectorAll('.video-btn').forEach(button => {
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        openProductVideo(button.dataset.videoSrc, button.dataset.videoTitle);
      });
    });
    updateCards();
  }

  let videoReturnFocus = null;
  function openProductVideo(src, title) {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('productVideo');
    videoReturnFocus = document.activeElement;
    document.getElementById('videoModalTitle').innerText = title;
    video.src = src;
    video.load();
    modal.classList.add('visible');
    modal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    modal.querySelector('.video-close-button').focus();
  }
  function closeProductVideo() {
    const modal = document.getElementById('videoModal');
    const video = document.getElementById('productVideo');
    if (!modal.classList.contains('visible')) return;
    video.pause();
    video.removeAttribute('src');
    video.load();
    modal.classList.remove('visible');
    modal.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (videoReturnFocus && typeof videoReturnFocus.focus === 'function') videoReturnFocus.focus();
  }
  document.getElementById('videoModal').addEventListener('click', (e) => {
    if (e.target.matches('[data-close-video]')) closeProductVideo();
  });
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeProductVideo();
  });
  function renderNavForCategory() {
    const prevDisabled = (currentStep === 0);
    const nextText = (currentStep === TOTAL - 1) ? "Riepilogo finale" : "Avanti";
    navDiv.innerHTML = `
      <button class="secondary" id="prevBtn" ${prevDisabled ? 'disabled' : ''}>← Indietro</button>
      <button class="primary" id="nextBtn">${nextText}</button>
    `;
    document.getElementById('prevBtn')?.addEventListener('click', () => {
      if (currentStep > 0) {
        currentStep--;
        renderCurrentStep();
      }
    });
    document.getElementById('nextBtn')?.addEventListener('click', () => {
      const selectedOptions = getSelectedOptions(currentStep);
      if (selectedOptions.length === 0) {
        const errDiv = document.getElementById('stepError');
        if (errDiv) errDiv.style.display = 'block';
        else alert("Seleziona un'opzione o 'Non mi interessa'");
        return;
      }
      const perPersonOption = selectedOptions.find(opt => opt.perPerson && opt.price !== 0);
      if (perPersonOption && (!selections[currentStep].participants || selections[currentStep].participants < 1)) {
        alert("Per il food, inserisci il numero di invitati.");
        return;
      }
      if (currentStep < TOTAL - 1) {
        currentStep++;
        renderCurrentStep();
      } else if (currentStep === TOTAL - 1) {
        currentStep = TOTAL;
        showSummary = false;   // arriva allo step dati senza riepilogo visibile
        renderCurrentStep();
      }
    });
  }

  // Form per inserire i dati prima di vedere il riepilogo
  function renderContactFormForSummary() {
    return `
      <div class="category-title">I tuoi recapiti</div>
      <div class="sub">Inserisci nome ed email per visualizzare il riepilogo completo del preventivo.<br>I tuoi dati verranno registrati anche se non invierai il preventivo.</div>
      <div class="contact-details-form">
        <input type="text" id="c_name" class="input-name" placeholder="Nome e Cognome (coppia) *" autocomplete="name" value="${escapeHtml(userContact.name)}">
        <input type="email" id="c_email" class="input-name" placeholder="La tua email *" autocomplete="email" value="${escapeHtml(userContact.email)}">
        <input type="tel" id="c_phone" class="input-name" placeholder="Telefono (facoltativo)" autocomplete="tel" value="${escapeHtml(userContact.phone)}">
        <div id="contactError" class="error-msg" style="display:none;">Inserisci nome ed email.</div>
        <div id="contactStatus" class="status-msg" style="display:none;"></div>
        <button class="primary" id="showSummaryBtn" style="width:100%; margin-top:1rem;">Visualizza riepilogo</button>
      </div>
    `;
  }

  // Riepilogo con totali e invii
  function renderFullSummary() {
    let rows = '';
    let total = 0;
    for (let i = 0; i < TOTAL; i++) {
      const cat = CATEGORIES[i];
      const sel = selections[i];
      const selectedOptions = getSelectedOptions(i);
      if (selectedOptions.length > 0) {
        selectedOptions.forEach(opt => {
          if (opt.price === 0) {
            rows += `
              <div class="summary-row">
                <span><strong>${escapeHtml(cat.name)}</strong><br><span style="color:#b4845c;">Nessuna scelta</span></span>
                <span>€ 0</span>
              </div>
            `;
            return;
          }
          const price = getOptionPrice(opt, sel);
          total += price;
          let priceDisplay = formatOptionPrice(opt);
          if (opt.perPerson && sel.participants && sel.participants > 0) {
            priceDisplay = `${opt.startingAt ? 'da ' : ''}€ ${opt.price.toLocaleString()}/persona × ${sel.participants} = € ${price.toLocaleString()}`;
          } else if (opt.perPerson) {
            priceDisplay = "Numero invitati non indicato";
          }
          rows += `
            <div class="summary-row">
              <span><strong>${escapeHtml(cat.name)}</strong><br><span style="font-size:0.8rem;">${escapeHtml(opt.name)}</span></span>
              <span style="font-weight:600;">${priceDisplay}</span>
            </div>
          `;
        });
      } else {
        rows += `<div class="summary-row"><span><strong>${escapeHtml(cat.name)}</strong><br><span style="color:#b4845c;">Nessuna scelta</span></span><span>€ 0</span></div>`;
      }
    }
    return `
      <div class="category-title">Il tuo preventivo personalizzato</div>
      <div class="sub">Verifica le tue scelte, poi invia il preventivo via WhatsApp o email. Le voci "a partire da" indicano prezzi minimi.</div>
      <div class="summary-table">
        ${rows}
        <div class="total-row"><span>TOTALE MINIMO INDICATIVO</span><span>€ ${total.toLocaleString()}</span></div>
      </div>
      <div class="send-group">
        <button id="sendWhatsBtn" class="send-btn">Invia preventivo via WhatsApp</button>
        <button id="sendMailBtn" class="send-btn email">Invia via Email</button>
      </div>
    `;
  }

  function renderNavForSummary(showEdit = true) {
    if (showEdit) {
      navDiv.innerHTML = `
        <button class="secondary" id="backEditBtn">Modifica selezioni</button>
        <button class="secondary" id="resetAllBtn" style="background:#e6cfbc;">Ricomincia da capo</button>
      `;
      document.getElementById('backEditBtn')?.addEventListener('click', () => {
        currentStep = TOTAL - 1;
        showSummary = false;
        renderCurrentStep();
      });
      document.getElementById('resetAllBtn')?.addEventListener('click', () => {
        if (confirm('Cancellare tutte le selezioni e ricominciare?')) {
          selections = Array(TOTAL).fill().map(createEmptySelection);
          currentStep = 0;
          showSummary = false;
          renderCurrentStep();
        }
      });
    } else {
      navDiv.innerHTML = `<button class="secondary" id="backToDataBtn">← Indietro</button>`;
      document.getElementById('backToDataBtn')?.addEventListener('click', () => {
        currentStep = TOTAL;
        showSummary = false;
        renderCurrentStep();
      });
    }
  }

  function buildMessage(clientName) {
    const nameLine = clientName.trim() || "Cliente";
    let msg = `DELDUCA WEDDINGS - Preventivo\nCoppia: ${nameLine}\n\n`;
    let total = 0;
    for (let i = 0; i < TOTAL; i++) {
      const cat = CATEGORIES[i];
      const sel = selections[i];
      const selectedOptions = getSelectedOptions(i);
      if (selectedOptions.length > 0) {
        selectedOptions.forEach(opt => {
          if (opt.price === 0) {
            msg += `- ${cat.name}: nessuna scelta\n`;
            return;
          }
          const price = getOptionPrice(opt, sel);
          total += price;
          const startingLabel = opt.startingAt ? 'da ' : '';
          const extra = opt.perPerson && sel.participants
            ? ` (${startingLabel}€ ${opt.price.toLocaleString()}/persona × ${sel.participants})`
            : '';
          msg += `- ${cat.name}: ${opt.name}${extra} -> ${startingLabel}€ ${price.toLocaleString()}\n`;
        });
      } else {
        msg += `- ${cat.name}: nessuna selezione\n`;
      }
    }
    msg += `\nTOTALE MINIMO INDICATIVO: € ${total.toLocaleString()}\nGrazie per averci scelto, riceverai un nostro contatto.`;
    return msg;
  }

  // Invio contatti a Google Apps Script (no-cors) - viene chiamato solo al momento di "Visualizza riepilogo"
  function submitContactToGoogle(contact, showStatusDiv = false) {
    return fetch(WEBAPP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(contact)
    }).then(() => {
      console.log("Contatto inviato allo script", contact);
      if (showStatusDiv) {
        const statusDiv = document.getElementById('contactStatus');
        if (statusDiv) {
          statusDiv.style.display = 'block';
          statusDiv.innerText = "✅ Dati registrati!";
          setTimeout(() => { statusDiv.style.display = 'none'; }, 3000);
        }
      }
    }).catch(e => console.error("Errore invio contatto:", e));
  }

  function attachSummaryEvents() {
    const whatsBtn = document.getElementById('sendWhatsBtn');
    const emailBtn = document.getElementById('sendMailBtn');
    if (whatsBtn) {
      whatsBtn.onclick = () => {
        if (!userContact.name || !userContact.email) {
          alert("Dati mancanti. Torna indietro e inserisci nome ed email.");
          return;
        }
        // NON inviamo più i dati allo script qui (sono già stati inviati al momento del riepilogo)
        const msg = buildMessage(userContact.name);
        window.open(`https://wa.me/393331395730?text=${encodeURIComponent(msg)}`, '_blank');
      };
    }
    if (emailBtn) {
      emailBtn.onclick = () => {
        if (!userContact.name || !userContact.email) {
          alert("Dati mancanti. Torna indietro e inserisci nome ed email.");
          return;
        }
        const subject = `Preventivo Matrimonio - ${userContact.name}`;
        const body = buildMessage(userContact.name);
        window.location.href = `mailto:iartservizi@gmail.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
      };
    }
  }

  // Render principale
  function renderCurrentStep() {
    if (currentStep < TOTAL) {
      dynamicDiv.innerHTML = renderCategoryStep(currentStep);
      attachCategoryEvents();
      renderNavForCategory();
      updateProgress();
    } else if (currentStep === TOTAL && !showSummary) {
      dynamicDiv.innerHTML = renderContactFormForSummary();
      const btn = document.getElementById('showSummaryBtn');
      if (btn) {
        btn.addEventListener('click', async () => {
          const name = document.getElementById('c_name')?.value.trim() || "";
          const email = document.getElementById('c_email')?.value.trim() || "";
          const phone = document.getElementById('c_phone')?.value.trim() || "";
          const errDiv = document.getElementById('contactError');
          if (!name || !email) {
            if (errDiv) errDiv.style.display = 'block';
            return;
          }
          if (errDiv) errDiv.style.display = 'none';
          userContact = { name, email, phone };
          // INVIO IMMEDIATO ALL'APPS SCRIPT (solo qui, non più nei pulsanti di invio)
          await submitContactToGoogle(userContact, true);
          showSummary = true;
          renderCurrentStep();
        });
      }
      renderNavForSummary(false);
      updateProgress();
    } else if (currentStep === TOTAL && showSummary) {
      dynamicDiv.innerHTML = renderFullSummary();
      attachSummaryEvents();
      renderNavForSummary(true);
      updateProgress();
    }
  }

  // Animazione logo
  const introOverlay = document.getElementById('introOverlay');
  const fixedLogo = document.getElementById('fixedLogo');
  const mainContainer = document.getElementById('mainContainer');
  function startAnimation() {
    setTimeout(() => {
      introOverlay.classList.add('fade-out');
      fixedLogo.classList.add('visible');
      mainContainer.classList.add('visible');
    }, 900);
  }
  window.addEventListener('load', startAnimation);
  setTimeout(() => { if (introOverlay && !introOverlay.classList.contains('fade-out')) startAnimation(); }, 1500);

  function init() {
    selections = Array(TOTAL).fill().map(createEmptySelection);
    currentStep = 0;
    showSummary = false;
    renderCurrentStep();
  }
  init();
</script>
</body>
</html>
